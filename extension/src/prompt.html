<!doctype html>
<!-- Adapted from moin (MIT), https://github.com/exxvius/moin — see PRIVACY.md. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="promptWindowTitle">Start WingHarness?</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="prompt.css" />
  </head>
  <body>
    <div class="card">
      <div class="row">
        <img class="logo" src="../icons/icon.svg" width="34" height="34" alt="" />
        <h1 data-i18n="promptTitle">WingHarness isn't running</h1>
      </div>
      <p class="muted" data-i18n="promptBody">Start WingHarness, then send it this download.</p>
      <div class="file" id="file" data-i18n="promptFallbackFile">this download</div>
      <div class="actions">
        <button id="cancel" class="btn secondary" data-i18n="promptNotNow">Not now</button>
        <button id="retry" class="btn" data-i18n="promptRetry">I started it</button>
      </div>
    </div>
    <script src="i18n.js"></script>
    <script src="prompt.js"></script>
  </body>
</html>
