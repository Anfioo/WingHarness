- name: "area: database"
  color: 1d76db
  description: "Data sources, the SQL console and table management. / 数据源、SQL 控制台与表管理。"
- name: "area: git"
  color: 1d76db
  description: "The local Git client. / 本地 Git 客户端。"
- name: "area: svn"
  color: 1d76db
  description: "The Subversion workspace. / Subversion 工作区。"
- name: "area: servers"
  color: 0052cc
  description: "SSH and SFTP server management. / SSH 与 SFTP 服务器管理。"
- name: "area: ports"
  color: 0052cc
  description: "Listening ports and the processes behind them. / 监听端口及其进程。"
- name: "area: frp"
  color: 0052cc
  description: "The FRP console and frpc processes. / FRP 控制台与 frpc 进程。"
- name: "area: system-tools"
  color: 0052cc
  description: "The Windows maintenance console. / Windows 维护控制台。"
- name: "area: ai"
  color: 5319e7
  description: "AI config sync and provider switching. / AI 配置同步与供应商切换。"
- name: "area: claude"
  color: 5319e7
  description: "The Claude chat, history and workflow pages. / Claude 对话、历史与工作流页面。"
- name: "area: mcp"
  color: 5319e7
  description: "The local MCP gateway. / 本地 MCP 网关。"
- name: "area: settings"
  color: c5def5
  description: "The settings and about windows. / 设置与关于窗口。"
- name: "area: i18n"
  color: c5def5
  description: "Translations and locale files. / 翻译与语言文件。"
- name: "area: build"
  color: c5def5
  description: "Packaging, releases and the updater. / 打包、发布与自动更新。"
