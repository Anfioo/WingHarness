name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build, e.g. v0.1.0'
        required: true
        type: string

jobs:
  # Creates the draft release first, so the build job uploads into it. The body
  # is generated from the conventional commits since the previous tag instead
  # of a one-line placeholder, and the release stays a draft for review.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # changelogithub walks the tag history, so the full log is required.
          fetch-depth: 0

      - name: Resolve the release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tag (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "${{ steps.vars.outputs.tag }}" -m "Release ${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx changelogithub --draft --name "${{ steps.vars.outputs.tag }}"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    # Job-level env so the var survives into the tauri-action step and from
    # there into `tauri build` -> beforeBuildCommand -> `pnpm build` -> vite.
    # Step-level env in that step merges with this block, it does not replace it.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
#          - platform: 'macos-latest' # for Arm based macs (M1 and above).
#            args: '--target aarch64-apple-darwin'
#          - platform: 'macos-latest' # for Intel based macs.
#            args: '--target x86_64-apple-darwin'
#          - platform: 'ubuntu-22.04'
#            args: ''
          - platform: 'windows-latest'
            args: '--bundles nsis,updater'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the commit the release tag points at, including manual runs.
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Records where the heap limit came from, so a future OOM is diagnosable
      # from the log alone.
      - name: Show Node build environment
        run: node -p "process.version + ' | heap limit ' + Math.round(require('node:v8').getHeapStatistics().heap_size_limit/1048576) + ' MB | ram ' + Math.round(require('node:os').totalmem()/1073741824) + ' GB'"

      - name: Configure updater
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          REPO="${{ github.repository }}"
          ENDPOINT="https://github.com/${REPO}/releases/latest/download/latest.json"
          PUBKEY="${TAURI_SIGNING_PUBLIC_KEY}"

          if [[ -z "${PUBKEY}" ]]; then
            echo "TAURI_SIGNING_PUBLIC_KEY is missing or empty."
            exit 1
          fi

          if ! printf '%s' "${PUBKEY}" | base64 --decode | grep -q '^untrusted comment:'; then
            echo "TAURI_SIGNING_PUBLIC_KEY is not a valid Base64-encoded Tauri public key."
            exit 1
          fi

          # Replace placeholders in tauri.conf.json
          sed -i.bak "s|__TAURI_UPDATER_ENDPOINT__|${ENDPOINT}|g" src-tauri/tauri.conf.json
          sed -i.bak "s|__TAURI_UPDATER_PUBKEY__|${PUBKEY}|g" src-tauri/tauri.conf.json

          if grep -q '__TAURI_UPDATER_' src-tauri/tauri.conf.json; then
            echo "Updater placeholders were not replaced."
            exit 1
          fi

          echo "Updater configured with endpoint: ${ENDPOINT}"

      - name: Resolve the draft release
        id: draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          release_id="$(gh api "repos/${REPOSITORY}/releases?per_page=100" | jq -r --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag and .draft == true)][0].id // empty')"
          if [ -z "$release_id" ]; then
            echo "Draft release not found for tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Build the project
        uses: tauri-apps/tauri-action@v0
        id: tauri-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.draft_release.outputs.id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
