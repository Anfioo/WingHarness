name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build, e.g. v0.1.0'
        required: true
        type: string

jobs:
  # Creates the draft release first, so the build job uploads into it. The body
  # is generated from the conventional commits since the previous tag instead
  # of a one-line placeholder, and the release stays a draft for review.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
      release_body: ${{ steps.release.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # changelogithub walks the tag history, so the full log is required.
          fetch-depth: 0

      - name: Resolve the release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tag (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "${{ steps.vars.outputs.tag }}" -m "Release ${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx changelogithub --draft --name "${{ steps.vars.outputs.tag }}"

      # Resolve the release once, in the creating job. Downstream jobs consume
      # these outputs instead of independently listing releases through the API.
      - name: Resolve the created release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${REPOSITORY}/releases?per_page=100" | jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag and .draft == true)][0].id // empty')"
          if [ -z "$release_id" ]; then
            echo "Draft release not found for tag $TAG in $REPOSITORY" >&2
            exit 1
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

          body="$(gh api "repos/${REPOSITORY}/releases/${release_id}" | jq -r '.body // ""')"
          {
            echo "body<<WH_RELEASE_BODY_EOF"
            printf '%s\n' "$body"
            echo "WH_RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  # Packages the browser extension and attaches both zips to the same draft
  # release, so the release page carries the app installer and the extension
  # side by side. build.mjs has no dependencies, so no install step is needed.
  publish-extension:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the browser extension
        run: node extension/build.mjs

      # The release id comes from create-release, so this job never has to
      # list releases or race another publisher.
      - name: Upload the extension zips
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          for zip in extension/dist/*.zip; do
            name="$(basename "$zip")"
            existing="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id')"
            if [ -n "$existing" ]; then
              gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${existing}"
            fi
            upload_url="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" | jq -r '.upload_url' | sed 's/{?name,label}$//')"
            if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
              echo "Release upload URL not found for release ${RELEASE_ID}" >&2
              exit 1
            fi
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/zip" \
              --data-binary "@${zip}" \
              "${upload_url}?name=$(jq -rn --arg name "$name" '$name|@uri')"
          done

  publish-tauri:
    # Keep all release asset writes serialized: the extension upload must finish
    # before tauri-action adds installers and updater metadata to the draft.
    needs: [create-release, publish-extension]
    permissions:
      contents: write
    # Job-level env so the var survives into the tauri-action step and from
    # there into `tauri build` -> beforeBuildCommand -> `pnpm build` -> vite.
    # Step-level env in that step merges with this block, it does not replace it.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
#          - platform: 'macos-latest' # for Arm based macs (M1 and above).
#            args: '--target aarch64-apple-darwin'
#          - platform: 'macos-latest' # for Intel based macs.
#            args: '--target x86_64-apple-darwin'
#          - platform: 'ubuntu-22.04'
#            args: ''
          - platform: 'windows-latest'
            args: '--bundles nsis,updater'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the commit the release tag points at, including manual runs.
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Records where the heap limit came from, so a future OOM is diagnosable
      # from the log alone.
      - name: Show Node build environment
        run: node -p "process.version + ' | heap limit ' + Math.round(require('node:v8').getHeapStatistics().heap_size_limit/1048576) + ' MB | ram ' + Math.round(require('node:os').totalmem()/1073741824) + ' GB'"

      - name: Configure updater
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          REPO="${{ github.repository }}"
          ENDPOINT="https://github.com/${REPO}/releases/latest/download/latest.json"
          # Fallbacks for users who cannot reach GitHub, tried in this order.
          # r2-sync and gitee-sync keep their fixed latest.json current.
          R2_ENDPOINT="https://wingharness.dpdns.org/WingHarness/latest/latest.json"
          GITEE_ENDPOINT="https://gitee.com/anfioo/WingHarness/releases/download/latest/latest.json"
          PUBKEY="${TAURI_SIGNING_PUBLIC_KEY}"

          if [[ -z "${PUBKEY}" ]]; then
            echo "TAURI_SIGNING_PUBLIC_KEY is missing or empty."
            exit 1
          fi

          if ! printf '%s' "${PUBKEY}" | base64 --decode | grep -q '^untrusted comment:'; then
            echo "TAURI_SIGNING_PUBLIC_KEY is not a valid Base64-encoded Tauri public key."
            exit 1
          fi

          # Replace placeholders in tauri.conf.json
          sed -i.bak "s|__TAURI_UPDATER_ENDPOINT__|${ENDPOINT}|g" src-tauri/tauri.conf.json
          sed -i.bak "s|__TAURI_UPDATER_R2_ENDPOINT__|${R2_ENDPOINT}|g" src-tauri/tauri.conf.json
          sed -i.bak "s|__TAURI_UPDATER_GITEE_ENDPOINT__|${GITEE_ENDPOINT}|g" src-tauri/tauri.conf.json
          sed -i.bak "s|__TAURI_UPDATER_PUBKEY__|${PUBKEY}|g" src-tauri/tauri.conf.json

          if grep -q '__TAURI_UPDATER_' src-tauri/tauri.conf.json; then
            echo "Updater placeholders were not replaced."
            exit 1
          fi

          echo "Updater configured with endpoints: ${ENDPOINT}, then ${R2_ENDPOINT}, then ${GITEE_ENDPOINT}"

      - name: Resolve the draft release
        id: draft_release
        shell: bash
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_BODY: ${{ needs.create-release.outputs.release_body }}
        run: |
          set -euo pipefail
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          {
            echo "body<<WH_RELEASE_BODY_EOF"
            printf '%s\n' "$RELEASE_BODY"
            echo "WH_RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the project
        uses: tauri-apps/tauri-action@v0
        id: tauri-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.draft_release.outputs.id }}
          releaseBody: ${{ steps.draft_release.outputs.body }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
