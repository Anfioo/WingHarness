name: "gitee-sync"

# Syncs a published release to Gitee: pushes the release tag, creates the
# matching Gitee release with the same notes, and uploads the GitHub release
# assets with latest.json repointed at Gitee.
# Hooking `release: published` instead of the build pipeline means the sync
# happens after the draft has been reviewed and published on GitHub, not while
# it is still a draft. `workflow_dispatch` backfills an older release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync, e.g. v0.0.4"
        required: true
        type: string

env:
  # Lowercase matches the canonical Gitee URLs; the login is case-insensitive.
  GITEE_OWNER: anfioo
  GITEE_REPO: WingHarness

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The tagged commit may be anywhere in the history, and it has to be
          # pushed complete before the tag can land on Gitee.
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve the release tag
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null)"; then
            echo "Tag ${TAG} does not exist on GitHub." >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Push the tag to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "The GITEE_TOKEN secret is not set." >&2
            exit 1
          fi

          # The token sits in the remote URL, so mask both before git can echo them.
          echo "::add-mask::${GITEE_TOKEN}"
          remote="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          echo "::add-mask::${remote}"

          # Gitee occasionally fails to resolve from a hosted runner; retry
          # instead of failing the whole sync on a transient DNS hiccup.
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "Attempt ${attempt} failed; retrying in 5s." >&2
              sleep 5
            done
            return 1
          }

          # An annotated tag lists the tag object and the peeled commit, a
          # lightweight tag lists the commit only; the last line is the commit
          # either way.
          remote_sha="$(retry git ls-remote --tags "${remote}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | awk '{print $1}')"

          if [ -n "${remote_sha}" ]; then
            if [ "${remote_sha}" != "${COMMIT}" ]; then
              echo "Gitee tag ${TAG} points at ${remote_sha}, but GitHub has ${COMMIT}." >&2
              exit 1
            fi
            echo "Tag ${TAG} is already on Gitee."
          else
            retry git push "${remote}" "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

      - name: Read the GitHub release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -r --arg tag "${TAG}" '[.[] | select(.tag_name == $tag)][0].body // ""')"
          if [ -z "${body}" ]; then
            body="Release ${TAG}"
          fi

          {
            echo "body<<WH_GITEE_BODY_EOF"
            printf '%s\n' "${body}"
            echo "WH_GITEE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check the Gitee release
        id: release
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # Gitee answers 200 with a literal `null` body when the tag has no
          # release, so the status code alone cannot tell the two apart.
          response="$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -w '\n%{http_code}' \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")"
          status="$(printf '%s' "${response}" | tail -n 1)"
          body="$(printf '%s\n' "${response}" | sed '$d')"

          if [ "${status}" != "200" ]; then
            echo "Gitee release lookup failed with HTTP ${status}." >&2
            exit 1
          fi

          if id="$(printf '%s' "${body}" | jq -er '.id' 2>/dev/null)"; then
            echo "Gitee already has a release for ${TAG}."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "id=${id}" >> "$GITHUB_OUTPUT"
          else
            echo "Gitee has no release for ${TAG}."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Re-runs must not fail on an existing release, and the action has no
      # update_release: a release that is already there is left untouched.
      - name: Create the Gitee release
        id: create
        if: steps.release.outputs.exists != 'true'
        uses: nicennnnnnnlee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722 # v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ steps.resolve.outputs.tag }}
          gitee_release_name: ${{ steps.resolve.outputs.tag }}
          gitee_release_body: ${{ steps.notes.outputs.body }}
          gitee_target_commitish: ${{ steps.resolve.outputs.commit }}

      - name: Download the GitHub release assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          dir="${RUNNER_TEMP}/gitee-assets"
          mkdir -p "${dir}"

          # gh exits non-zero when the release has no attachments; an empty
          # release is still worth syncing.
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" --clobber || true

          echo "Downloaded $(find "${dir}" -maxdepth 1 -type f | wc -l) file(s) from the GitHub release."
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Plan the Gitee uploads
        id: plan
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          DIR: ${{ steps.assets.outputs.dir }}
          RELEASE_ID: ${{ steps.create.outputs.release-id || steps.release.outputs.id }}
        run: |
          attachments="$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -w '\n%{http_code}' \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files?per_page=100&access_token=${GITEE_TOKEN}")"
          status="$(printf '%s' "${attachments}" | tail -n 1)"
          body="$(printf '%s\n' "${attachments}" | sed '$d')"

          # An unreadable list must fail the job: treating it as empty would
          # re-upload files that are already on the release.
          if [ "${status}" != "200" ]; then
            echo "Listing Gitee attachments failed with HTTP ${status}." >&2
            exit 1
          fi

          existing="$(printf '%s' "${body}" | jq -r '.[].name' 2>/dev/null || true)"

          files=()
          has_latest=false
          latest_missing=false

          for file in "${DIR}"/*; do
            [ -f "${file}" ] || continue
            name="$(basename "${file}")"

            if [ "${name}" = "latest.json" ]; then
              has_latest=true
              if ! printf '%s\n' "${existing}" | grep -qxF "${name}"; then
                latest_missing=true
              fi
              continue
            fi

            if printf '%s\n' "${existing}" | grep -qxF "${name}"; then
              echo "Already on Gitee: ${name}"
              continue
            fi
            files+=("${file}")
          done

          echo "Files to upload: ${#files[@]}, latest.json missing: ${latest_missing}."
          {
            echo "count=${#files[@]}"
            echo "has_latest=${has_latest}"
            echo "latest_missing=${latest_missing}"
            if [ "${#files[@]}" -gt 0 ]; then
              echo "files<<WH_GITEE_FILES_EOF"
              printf '%s\n' "${files[@]}"
              echo "WH_GITEE_FILES_EOF"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Upload the release files to Gitee
        if: steps.plan.outputs.count != '0'
        uses: nicennnnnnnlee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722 # v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create.outputs.release-id || steps.release.outputs.id }}
          gitee_tag_name: ${{ steps.resolve.outputs.tag }}
          gitee_files: ${{ steps.plan.outputs.files }}
          gitee_upload_retry_times: 3

      # The updater manifest must point at Gitee, not GitHub. The base URL is
      # the documented Gitee layout; probing one uploaded file proves it before
      # a broken latest.json is published.
      - name: Resolve the Gitee download base
        id: base
        shell: bash
        env:
          DIR: ${{ steps.assets.outputs.dir }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          probe="$(find "${DIR}" -maxdepth 1 -type f ! -name 'latest.json' -printf '%f\n' | head -n 1)"
          if [ -z "${probe}" ]; then
            echo "No release files found; nothing to point latest.json at." >&2
            exit 1
          fi

          base="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
          # A range request answers 206 when Gitee honours it, 200 when it does not.
          status="$(curl -sS -L -r 0-0 --retry 5 --retry-delay 3 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "${base}/${probe}")"
          if [ "${status}" != "200" ] && [ "${status}" != "206" ]; then
            echo "Gitee download URL check failed: ${base}/${probe} returned HTTP ${status}." >&2
            exit 1
          fi

          echo "Gitee download base: ${base}"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Point latest.json at Gitee
        shell: bash
        env:
          DIR: ${{ steps.assets.outputs.dir }}
          TAG: ${{ steps.resolve.outputs.tag }}
          GITEE_BASE: ${{ steps.base.outputs.base }}
        run: |
          latest="${DIR}/latest.json"
          if [ ! -f "${latest}" ]; then
            echo "This release has no latest.json."
            exit 0
          fi

          github_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          jq --arg old "${github_base}" --arg new "${GITEE_BASE}" \
            'walk(if type == "string" then split($old) | join($new) else . end)' \
            "${latest}" > "${latest}.tmp"
          mv "${latest}.tmp" "${latest}"

          if grep -qF "${github_base}" "${latest}"; then
            echo "latest.json still points at GitHub." >&2
            exit 1
          fi
          echo "latest.json now downloads from ${GITEE_BASE}."

      # Uploaded last so the manifest never references a file that is not there.
      - name: Upload latest.json to Gitee
        if: steps.plan.outputs.has_latest == 'true' && steps.plan.outputs.latest_missing == 'true'
        uses: nicennnnnnnlee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722 # v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create.outputs.release-id || steps.release.outputs.id }}
          gitee_tag_name: ${{ steps.resolve.outputs.tag }}
          gitee_file_name: latest.json
          gitee_file_path: ${{ steps.assets.outputs.dir }}/latest.json
          gitee_upload_retry_times: 3

      - name: Summarize
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          if [ "${RELEASE_EXISTS}" = "true" ]; then
            echo "Gitee already had a release for ${TAG}."
          fi
          echo "Gitee release: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
