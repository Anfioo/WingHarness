name: "gitee-sync"

# Syncs a published release to Gitee: pushes the release tag and creates the
# matching Gitee release with the same notes. Hooking `release: published`
# instead of the build pipeline means the sync happens after the draft has been
# reviewed and published on GitHub, not while it is still a draft.
# `workflow_dispatch` backfills a release that was published before this
# workflow existed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync, e.g. v0.0.4"
        required: true
        type: string

env:
  GITEE_OWNER: Anfioo
  GITEE_REPO: WingHarness

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The tagged commit may be anywhere in the history, and it has to be
          # pushed complete before the tag can land on Gitee.
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve the release tag
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null)"; then
            echo "Tag ${TAG} does not exist on GitHub." >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Push the tag to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "The GITEE_TOKEN secret is not set." >&2
            exit 1
          fi

          # The token sits in the remote URL, so mask both before git can echo them.
          echo "::add-mask::${GITEE_TOKEN}"
          remote="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          echo "::add-mask::${remote}"

          # An annotated tag lists the tag object and the peeled commit, a
          # lightweight tag lists the commit only; the last line is the commit
          # either way.
          remote_sha="$(git ls-remote --tags "${remote}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | awk '{print $1}')"

          if [ -n "${remote_sha}" ]; then
            if [ "${remote_sha}" != "${COMMIT}" ]; then
              echo "Gitee tag ${TAG} points at ${remote_sha}, but GitHub has ${COMMIT}." >&2
              exit 1
            fi
            echo "Tag ${TAG} is already on Gitee."
          else
            git push "${remote}" "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

      - name: Read the GitHub release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -r --arg tag "${TAG}" '[.[] | select(.tag_name == $tag)][0].body // ""')"
          if [ -z "${body}" ]; then
            body="Release ${TAG}"
          fi

          {
            echo "body<<WH_GITEE_BODY_EOF"
            printf '%s\n' "${body}"
            echo "WH_GITEE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check the Gitee release
        id: release
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")"
          echo "Gitee release lookup returned HTTP ${status}."

          if [ "${status}" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Re-runs must not fail on an existing release, and the action has no
      # update_release: a release that is already there is left untouched.
      - name: Create the Gitee release
        if: steps.release.outputs.exists != 'true'
        uses: nicennnnnnnlee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722 # v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ steps.resolve.outputs.tag }}
          gitee_release_name: ${{ steps.resolve.outputs.tag }}
          gitee_release_body: ${{ steps.notes.outputs.body }}
          gitee_target_commitish: ${{ steps.resolve.outputs.commit }}

      - name: Summarize
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          if [ "${RELEASE_EXISTS}" = "true" ]; then
            echo "Gitee already had a release for ${TAG}; left it untouched."
          fi
          echo "Gitee release: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
