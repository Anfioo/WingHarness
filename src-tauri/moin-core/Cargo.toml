[package]
name = "moin-core"
version = "0.0.1"
description = "Download engine: HTTP transfers, queue, categories and the browser-extension RPC."
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "moin_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "process", "net"] }
async-trait = "0.1"
# `stream` is what `bytes_stream()` needs. `system-proxy` and `socks` keep this
# crate's client on the same proxy rules as the app, even when it is built
# without the root crate's feature set (tests, tools).
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "system-proxy", "socks"] }
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
