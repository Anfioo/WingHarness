[package]
name = "ports-core"
version = "0.0.1"
description = "Ports page engine: TCP listener enumeration, pinned ports and process termination."
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "ports_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sysinfo = "0.40.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_UI_Shell"] }
