[package]
name = "server-core"
version = "0.0.1"
description = "SSH and SFTP engine for the server manager window."
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "server_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
# Pure-Rust SSH stack: the same one the XTerm reference project validated, so
# no system libssh / OpenSSL DLL is needed. Default features pull aws-lc-rs,
# whose build needs NASM; the ring backend avoids that toolchain dependency.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0"
# Kept only for the one-shot v1 migration: legacy credentials are read out of
# the OS keychain and rewritten as plain text in servers.json. New credentials
# never touch the keychain. The feature set matches git-core so the app links a
# single keyring 3 build.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ring = "0.17"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "fs", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
async-trait = "0.1"
