[package]
name = "systools-core"
version = "0.0.1"
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "systools_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
blake3 = "1"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
tempfile = "3"
getrandom = "0.3"
png = "0.17"
encoding_rs = "0.8"
winreg = { version = "0.56", features = ["transactions"] }
windows = { version = "0.62", features = ["Win32_Foundation","Win32_Storage_FileSystem","Win32_System_Com","Win32_System_Ole","Win32_System_TaskScheduler","Win32_System_Services","Win32_System_Variant","Win32_System_Registry","Win32_UI_Shell"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Storage_FileSystem","Win32_System_IO","Win32_System_Ioctl","Win32_System_Threading","Win32_UI_Shell"] }
