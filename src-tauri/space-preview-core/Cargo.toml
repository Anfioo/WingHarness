[package]
name = "space-preview-core"
version = "0.0.1"
description = "Space preview engine: file inspection, ranged reads, text write-back, presentations, icons and the Windows space agent."
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "space_preview_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mime_guess = "2"
encoding_rs = "0.8"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# System file icons are rendered straight to PNG before crossing the IPC bridge.
png = "0.17"
