[package]
name = "api-core"
version = "0.0.1"
description = "HTTP request engine and workspace store for the API client."
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "api_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The request engine. Compression / multipart / streaming are declared here and
# merged into the workspace's single reqwest by feature unification, so the
# decoders compile once for the whole app (git-core shares the same reqwest).
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
  "gzip",
  "brotli",
  "deflate",
  "stream",
  "charset",
] }
# `sync` backs the cancellation registry, `time` the per-request timeouts, `fs`
# streaming multipart file fields, and `rt` spawn_blocking for blocking reads.
# The runtime itself is Tauri's.
tokio = { version = "1", features = ["sync", "time", "fs", "rt"] }
futures-util = "0.3"
bytes = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Local HTTP server for the send-path integration tests. Dev-only, never shipped.
httpmock = "0.7"
tempfile = "3"
