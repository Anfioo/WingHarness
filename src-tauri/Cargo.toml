[package]
name = "wingharness"
version = "0.0.13"
description = "WingHarness, a local-first desktop workspace built on Tauri."
authors = ["Anfioo"]
license = "GPL-3.0-only"
edition = "2021"

# The preview backend is its own package. The workspace root is this directory,
# so `Cargo.lock` and `target/` stay put and the Tauri CLI's `src-tauri`
# convention is unchanged.
[workspace]
members = [
    "file-preview-core",
    "git-core",
    "api-core",
    "svn-core",
    "shaic-core",
    "prism-core",
    "systools-core",
    "server-core",
    "frp-core",
    "md-editor-core",
    "db-core",
    "space-preview-core",
    "ports-core",
    "moin-core",
]
resolver = "2"

# No release profile was configured before, so the shipped binary was built at
# Cargo's defaults. Size-optimized codegen + LTO + strip is a cheap net win with
# no runtime behavior change.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[features]
# Release builds ship without the WebView inspector, which is what the window
# menu's "Developer Tools" entry needs. Debug builds have it regardless (the
# cfg that guards the command accepts either).
devtools = ["tauri/devtools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wingharness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The preview page's backend: reads the working copy's raw bytes.
file-preview-core = { path = "file-preview-core" }
# The standalone Git repository window's engine (libgit2).
git-core = { path = "git-core" }
# The API client's request engine and workspace store. Independent of git-core's
# own http client on purpose: the two have different needs and no shared state.
api-core = { path = "api-core" }
# The SVN working-copy engine: spawns the local `svn` CLI and parses its output.
# Unlike git-core/api-core it implements no protocol of its own.
svn-core = { path = "svn-core" }
# The Clash page's engine: Prism compiles a source profile into the config the
# user-supplied mihomo runs, plus a minimal process manager for that binary.
prism-core = { path = "prism-core" }
# The systools page's engine: disk analysis, duplicate/large-file cleanup,
# startup items, application uninstall, and system settings (Windows only).
systools-core = { path = "systools-core" }
# The server manager's engine: the SSH connection pool, interactive shell
# sessions, SFTP file operations and the transfer queue.
server-core = { path = "server-core" }
# The FRP console's engine: server profiles, tunnels, local frpc runtimes and
# the child-process supervisor behind them.
frp-core = { path = "frp-core" }
# The Markdown editor's engine: document I/O with encoding fallback, settings,
# recent files and the restored session.
md-editor-core = { path = "md-editor-core" }
# The database page's engine: data sources, live connections (SQLite, PostgreSQL,
# MySQL), introspection, query execution and table editing.
db-core = { path = "db-core" }
# The file preview page's upgraded engine and the Windows space agent: file
# inspection, ranged reads, text write-back, presentations and icons.
space-preview-core = { path = "space-preview-core" }
# The ports page's engine: TCP listener enumeration, pinned ports and process
# termination (Windows only).
ports-core = { path = "ports-core" }
# The moin download engine: HTTP tasks, resumable transfers and persistence.
moin-core = { path = "moin-core" }
# `unstable` is what unlocks `Window::add_child` — the only way to embed a
# webview inside an existing window, which is how the plugin page shows a
# plugin's own site (an iframe cannot: plugins forbid framing). Tauri marks
# multi-webview as unstable, so these APIs can move in a 2.x minor release.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# Download-complete notifications for the moin engine. Registered in `lib.rs`
# and allowed in `capabilities/default.json` (`notification:default`).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps insertion order (via indexmap) when rewriting JSON configs.
serde_json = { version = "1", features = ["preserve_order"] }
# Parses the yaml config sources a plugin can declare. `serde_yaml` is
# archived; `serde_yml` is its maintained successor and drops straight into
# the json adapter's shape.
serde_yml = "0.0.12"
# CC Switch: parse / serialize the TOML configs of Codex and Grok Build.
toml = "0.8"
# TOML structured editing that preserves key order and comments.
toml_edit = { version = "0.22", features = ["serde"] }
# CC Switch 的供应商库，以及后续数据库工具页的通用驱动。
# `sqlite` 特性自带 SQLite（`bundled`），不需要系统库。
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Preserve insertion order when rewriting JSON config files.
indexmap = { version = "2", features = ["serde"] }
# Cancels a running database statement (and anything else that needs a
# cooperative stop signal); the engine crates use it too.
tokio-util = "0.7"
portable-pty = "0.8"
base64 = "0.22"
font-kit = "0.14"
# `system-proxy` is part of the default feature set and would otherwise be
# switched off here: without it reqwest ignores HTTP_PROXY / HTTPS_PROXY, which
# is exactly how the app's proxy setting reaches every client.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks", "system-proxy"] }
# `tauri-plugin-updater` builds its own client from reqwest 0.13 without the
# proxy features. Cargo unifies features per crate version, so naming them here
# is what makes the update check and download follow the proxy setting.
reqwest_updater = { package = "reqwest", version = "0.13", default-features = false, features = ["system-proxy", "socks"] }
regex = "1"
sha2 = "0.10"
# The updater compares published versions with the running one. The plugin
# carries the same crate, but the development check reads manifests directly.
semver = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
once_cell = "1"
# Unpacks user-installed plugins. Only inflate is needed: plugins are ordinary
# zip files, and pulling in the default feature set (bzip2, lzma, zstd, aes)
# would add a large amount of build time for formats nobody ships.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The AI config-sync engine: store, agent adapters and materialize logic,
# adapted from https://github.com/dariocurr/shaic (MIT). See its `UPSTREAM.md`
# for what diverges from the original.
shaic-core = { path = "shaic-core" }

[target.'cfg(windows)'.dependencies]
# The moin settings tab displays the effective system proxy. Reading WinINET's
# settings is a registry lookup, not another process.
windows-registry = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
futures-util = "0.3"
# MCP Hub gateway needs a multi-threaded runtime plus subprocess / TCP / timers.
# Expanded from the bare "sync" used by the rest of the app — no new crates.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "time", "signal", "sync", "fs"] }
