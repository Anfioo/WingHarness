[package]
name = "agent-chat-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The Agent chat page's engine: Claude, Codex and ACP transports, plus native session scanning."
publish = false

[lib]
name = "agent_chat_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
tokio-util = "0.7"
tauri = { version = "2", features = [] }
