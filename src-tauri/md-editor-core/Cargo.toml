[package]
name = "md-editor-core"
version = "0.0.1"
description = "Markdown editor engine: document I/O, encoding fallback, settings, recent files and session state."
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "md_editor_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Fallback decoder for legacy Chinese documents that are not valid UTF-8.
encoding_rs = "0.8"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
# Native PDF export goes through WebView2's `PrintToPdf`. The versions are the
# ones `wry` already links in this workspace, so nothing new is fetched.
webview2-com = "0.39"
# Must track the `windows` version webview2-com 0.39 is generated against
# (0.62), otherwise the ICoreWebView2* interfaces are distinct types and the
# `Interface` trait that provides `cast` does not apply to them.
windows = { version = "0.62", features = ["Win32_Foundation"] }
