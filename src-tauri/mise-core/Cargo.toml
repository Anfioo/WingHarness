[package]
name = "mise-core"
version = "0.0.1"
description = "Environment manager engine: mise runtime probing, installed tools, project coverage and the mise configuration workspace."
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "mise_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
# `rt` is what enables `CancellationToken`, which the detail-loading cancel table
# and the action runner hand to the process layer.
tokio-util = { version = "0.7", features = ["rt"] }
sysinfo = "0.40.1"
# Console output on Windows is not always UTF-8; the process layer falls back
# through GBK before it decodes lossily.
encoding_rs = "0.8"
