[package]
name = "frp-core"
version = "0.0.1"
description = "FRP console engine: server profiles, tunnels, runtimes and frpc process supervision."
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "frp_core"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `frpc.toml` is generated from the structured form; the same toml version the
# workspace already links is reused, so nothing new is fetched.
toml = "0.8"
# Runtime records keep a content hash so re-probing can tell builds apart.
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
